<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MOEX · Дашборд</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f1115;--panel:#161a22;--border:#242a36;--text:#d7dbe3;--muted:#7b8494;
        --accent:#4f9eff;--green:#3fbf7f;--red:#e05b5b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--text);font-size:14px}
  header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sub{color:var(--muted);font-size:12px}
  header .links{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
  a.nav{background:var(--panel);border:1px solid var(--border);border-radius:6px;
        padding:7px 14px;color:var(--text);text-decoration:none;font-size:13px}
  a.nav:hover{border-color:var(--accent)}
  a.nav b{color:var(--accent);font-weight:600}
  main{padding:16px 24px 40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 18px}
  .panel h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);
            text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .panel h2 a{color:var(--accent);text-decoration:none;font-size:11px;text-transform:none;letter-spacing:0;margin-left:auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
  thead th{text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--muted);
           font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  thead th:first-child{text-align:left}
  tbody td{padding:5px 8px;border-bottom:1px solid #1a1f29;text-align:right}
  tbody td:first-child{text-align:left}
  tbody tr:hover{background:#141821}
  .ticker{font-weight:700}
  .bid{color:var(--green)} .ask{color:var(--red)}
  .up{color:var(--green)} .down{color:var(--red)}
  .super{box-shadow:inset 2px 0 0 var(--accent);font-weight:600}
  .gone{color:var(--muted)} .active{color:var(--green)}
  .eaten-cell{white-space:nowrap}
  .bar{display:inline-block;vertical-align:middle;width:44px;height:6px;border-radius:3px;
       background:#232936;margin-left:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}
  .p-low i{background:var(--green)} .p-mid i{background:#d8a13a} .p-high i{background:var(--red)}
  .pct{color:var(--muted);font-size:11px;margin-left:5px}
  .status{padding:8px 14px;border-radius:6px;margin:12px 24px 0;font-size:13px;display:none}
  .status.error{display:block;background:#2a1416;color:var(--red);border:1px solid #4a1f22}
  .meta{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>MOEX · Дашборд</h1>
  <span class="sub">единая точка входа · обновление 15 с</span>
  <nav class="links">
    <a class="nav" href="/atr.html"><b>ATR</b> всплески и супервсплески</a>
    <a class="nav" href="/tinkoff.html"><b>Стакан</b> плотности и лента</a>
    <a class="nav" href="/densities.html"><b>Топ плотностей</b> все тикеры</a>
    <a class="nav" href="/docs"><b>API</b> swagger</a>
  </nav>
</header>
<div id="status" class="status"></div>
<main>
  <div class="panel">
    <h2>Крупные плотности сейчас <a href="/densities.html">полный топ →</a></h2>
    <div id="dens"></div>
  </div>
  <div class="panel">
    <h2>Самые большие изменения цены <span class="meta">10 мин / с начала дня · T-Invest</span></h2>
    <div id="chg"></div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const statusEl=$('status');
function setStatus(m){if(!m){statusEl.className='status';statusEl.textContent='';return}
  statusEl.className='status error';statusEl.textContent=m}
function fmt(n,d=2){return n===null||n===undefined?'—':Number(n).toFixed(d)}
function fmtInt(n){return n===null||n===undefined?'—':Number(n).toLocaleString('ru-RU')}
function fmtBig(n){
  if(n===null||n===undefined) return '—';
  return n>=1e9 ? (n/1e9).toFixed(1)+' млрд' : n>=1e6 ? (n/1e6).toFixed(1)+' млн' : fmtInt(n);
}
function fmtEaten(n){
  if(!n) return '—';
  return n>=1e6 ? (n/1e6).toFixed(1)+' млн' : n>=1e3 ? (n/1e3).toFixed(1)+' тыс' : fmtInt(n);
}
function fmtTs(ts){
  const today=new Date().toISOString().slice(0,10);
  return ts.slice(0,10)===today ? ts.slice(11,19) : ts.slice(5,16).replace('T',' ');
}
async function jget(url){const r=await fetch(url);if(!r.ok){const t=await r.text();let m=t;try{m=JSON.parse(t).detail||t}catch(e){}throw new Error(m)}return r.json()}

function renderDens(rows){
  if(!rows.length){$('dens').innerHTML='<p style="color:var(--muted);margin:0">Пока нет данных — копятся поллером во время торгов.</p>';return}
  let h='<table><thead><tr><th>Тикер</th><th>Сторона</th><th>Цена</th><th>Размер</th><th>Съедено</th><th>R/avg</th><th>Статус</th></tr></thead><tbody>';
  for(const r of rows){
    const cls=r.side==='bid'?'bid':'ask';
    const pct=r.eaten_pct||0;
    const pCls=pct>70?'p-high':pct>30?'p-mid':'p-low';
    const pctTxt=pct>0?`<span class="pct">${pct.toFixed(0)}%</span>`:'';
    const bar=pct>0?`<span class="bar ${pCls}"><i style="width:${Math.min(pct,100)}%"></i></span>`:'';
    h+=`<tr class="${r.is_super?'super':''}">
      <td class="ticker">${r.ticker}</td>
      <td class="${cls}">${r.side==='bid'?'🟢':'🔴'}</td>
      <td class="${cls}">${fmt(r.price)}</td>
      <td><b>${fmtInt(r.size)}</b></td>
      <td class="eaten-cell">${fmtEaten(r.eaten)}${pctTxt}${bar}</td>
      <td>${fmt(r.ratio)}</td>
      <td class="${r.active?'active':'gone'}">${r.is_super?'💥 ':''}${r.status||(r.active?'активна':'ушла')}</td></tr>`;
  }
  $('dens').innerHTML=h+'</tbody></table>';
}
function pctCell(v){
  if(v===null||v===undefined) return '<td>—</td>';
  const cls=v>0.005?'up':v<-0.005?'down':'';
  return `<td class="${cls}"><b>${v>0?'+':''}${v.toFixed(2)}%</b></td>`;
}
function renderChg(rows){
  if(!rows.length){$('chg').innerHTML='<p style="color:var(--muted);margin:0">Нет данных.</p>';return}
  let h='<table><thead><tr><th>Тикер</th><th>Последняя</th><th>Δ 10 мин</th><th>Δ с начала дня</th><th>Оборот</th></tr></thead><tbody>';
  for(const r of rows){
    h+=`<tr><td class="ticker">${r.ticker}</td>
      <td>${fmt(r.last)}</td>
      ${pctCell(r.change10_pct)}
      ${pctCell(r.change_day_pct)}
      <td>${fmtBig(r.turnover)}</td></tr>`;
  }
  $('chg').innerHTML=h+'</tbody></table>';
}
async function load(){
  try{
    const [top, chg] = await Promise.allSettled([
      jget('/api/tinkoff/densities/top?limit=10'),
      jget('/api/moex/changes?limit=10'),
    ]);
    if(top.status==='fulfilled') renderDens(top.value.by_size);
    if(chg.status==='fulfilled') renderChg(chg.value.items);
    const errs=[top,chg].filter(x=>x.status==='rejected').map(x=>x.reason.message);
    setStatus(errs.length?('Частично: '+errs.join(' | ')):null);
  }catch(e){setStatus('Ошибка: '+e.message)}
}
$('status') && load();
setInterval(()=>{if(document.visibilityState==='visible')load()},15000);
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MOEX · Дашборд</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f1115;--panel:#161a22;--border:#242a36;--text:#d7dbe3;--muted:#7b8494;
        --accent:#4f9eff;--green:#3fbf7f;--red:#e05b5b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--text);font-size:14px}
  header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sub{color:var(--muted);font-size:12px}
  header .links{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
  a.nav{background:var(--panel);border:1px solid var(--border);border-radius:6px;
        padding:7px 14px;color:var(--text);text-decoration:none;font-size:13px}
  a.nav:hover{border-color:var(--accent)}
  a.nav b{color:var(--accent);font-weight:600}
  main{padding:16px 24px 40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 18px}
  .panel h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);
            text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .panel h2 a{color:var(--accent);text-decoration:none;font-size:11px;text-transform:none;letter-spacing:0;margin-left:auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
  thead th{text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--muted);
           font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  thead th:first-child{text-align:left}
  tbody td{padding:5px 8px;border-bottom:1px solid #1a1f29;text-align:right}
  tbody td:first-child{text-align:left}
  tbody tr:hover{background:#141821}
  .ticker{font-weight:700}
  .bid{color:var(--green)} .ask{color:var(--red)}
  .up{color:var(--green)} .down{color:var(--red)}
  .super{box-shadow:inset 2px 0 0 var(--accent);font-weight:600}
  .gone{color:var(--muted)} .active{color:var(--green)}
  .eaten-cell{white-space:nowrap}
  .bar{display:inline-block;vertical-align:middle;width:44px;height:6px;border-radius:3px;
       background:#232936;margin-left:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}
  .p-low i{background:var(--green)} .p-mid i{background:#d8a13a} .p-high i{background:var(--red)}
  .pct{color:var(--muted);font-size:11px;margin-left:5px}
  .status{padding:8px 14px;border-radius:6px;margin:12px 24px 0;font-size:13px;display:none}
  .status.error{display:block;background:#2a1416;color:var(--red);border:1px solid #4a1f22}
  .meta{color:var(--muted);font-size:12px}
  /* --- модалка «Итоги дня» --- */
  .modal{position:fixed;inset:0;background:rgba(5,8,12,.72);display:none;z-index:50;padding:24px}
  .modal.open{display:flex;align-items:flex-start;justify-content:center}
  .m-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;
         max-width:1100px;width:100%;max-height:calc(100vh - 48px);overflow:auto;padding:16px 20px 24px}
  .m-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .m-head h2{margin:0;font-size:16px}
  .m-head .meta{margin-right:auto}
  .m-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;
         padding:6px 14px;color:var(--text);font-size:13px;cursor:pointer}
  .m-btn:hover{border-color:var(--accent)}
  .m-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .m-btn.on{border-color:var(--accent);color:var(--accent)}
  #hist{display:none;margin:0 0 12px;flex-wrap:wrap;gap:8px}
  #hist.open{display:flex}
  .h-date{background:#0f1115;border:1px solid var(--border);border-radius:6px;
          padding:5px 12px;color:var(--text);font-size:12px;cursor:pointer;
          font-variant-numeric:tabular-nums}
  .h-date:hover{border-color:var(--accent)}
  .h-date.sel{border-color:var(--accent);color:var(--accent);font-weight:700}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .chip{background:#0f1115;border:1px solid var(--border);border-radius:6px;
        padding:6px 12px;font-size:12px}
  .chip b{font-size:14px;font-weight:700}
  .chip .lbl{color:var(--muted);font-size:11px;display:block}
  .sec-title{margin:18px 0 8px;font-size:12px;color:var(--muted);
             text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<header>
  <h1>MOEX · Дашборд</h1>
  <span class="sub">единая точка входа · обновление 15 с</span>
  <nav class="links">
    <a class="nav" href="/atr.html"><b>ATR</b> всплески и супервсплески</a>
    <a class="nav" href="/tinkoff.html"><b>Стакан</b> плотности и лента</a>
    <a class="nav" href="/densities.html"><b>Топ плотностей</b> все тикеры</a>
    <a class="nav" href="/docs"><b>API</b> swagger</a>
    <button class="nav" id="day-btn" style="cursor:pointer;font:inherit"><b>📊 Итоги дня</b> цены и плотности</button>
  </nav>
</header>
<div id="status" class="status"></div>
<main>
  <div class="panel">
    <h2>Крупные плотности сейчас
      <label class="meta" style="margin-left:auto;display:flex;align-items:center;gap:4px;cursor:pointer"
             title="Скрывать ушедшие, снятые и полностью съеденные уровни; сверху — выдержавшие больше ударов">
        <input type="checkbox" id="dens-live" checked>только живые</label>
      <a href="/densities.html" style="margin-left:0">полный топ →</a></h2>
    <div id="dens"></div>
  </div>
  <div class="panel">
    <h2>Самые большие изменения цены <span class="meta">10 мин / с начала дня · T-Invest</span></h2>
    <div id="chg"></div>
  </div>
</main>
<!-- Модалка «Итоги дня» -->
<div class="modal" id="day-modal">
  <div class="m-box">
    <div class="m-head">
      <h2>Итоги дня <span class="meta" id="day-date"></span></h2>
      <span class="meta" id="day-meta"></span>
      <button class="m-btn primary" id="day-refresh">Обновить</button>
      <button class="m-btn" id="day-hist-btn">История</button>
      <button class="m-btn" id="day-close">✕</button>
    </div>
    <div id="hist"></div>
    <div id="day-status" class="status" style="margin:0 0 12px"></div>
    <div id="day-body"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const statusEl=$('status');
function setStatus(m){if(!m){statusEl.className='status';statusEl.textContent='';return}
  statusEl.className='status error';statusEl.textContent=m}
function fmt(n,d=2){return n===null||n===undefined?'—':Number(n).toFixed(d)}
function fmtInt(n){return n===null||n===undefined?'—':Number(n).toLocaleString('ru-RU')}
function fmtBig(n){
  if(n===null||n===undefined) return '—';
  return n>=1e9 ? (n/1e9).toFixed(1)+' млрд' : n>=1e6 ? (n/1e6).toFixed(1)+' млн' : fmtInt(n);
}
function fmtEaten(n){
  if(!n) return '—';
  return n>=1e6 ? (n/1e6).toFixed(1)+' млн' : n>=1e3 ? (n/1e3).toFixed(1)+' тыс' : fmtInt(n);
}
function fmtTs(ts){
  const today=new Date().toISOString().slice(0,10);
  return ts.slice(0,10)===today ? ts.slice(11,19) : ts.slice(5,16).replace('T',' ');
}
async function jget(url){const r=await fetch(url);if(!r.ok){const t=await r.text();let m=t;try{m=JSON.parse(t).detail||t}catch(e){}throw new Error(m)}return r.json()}

// Последний снимок топа плотностей: переключатель «только живые»
// перерисовывает панель без нового запроса.
let lastDens=[];
function renderDens(allRows){
  lastDens=allRows;
  // «Только живые»: убираем ушедшие/снятые/полностью съеденные (это все
  // уровни с active=false — у активных статус всегда «держится/активна»),
  // первыми — выдержавшие больше ударов, затем по размеру; показываем
  // топ-10, как раньше.
  let rows=lastDens;
  if($('dens-live') && $('dens-live').checked){
    rows=lastDens.filter(r=>r.active)
      .sort((a,b)=>(b.hits||0)-(a.hits||0)||(b.size||0)-(a.size||0));
    if(rows.length>10)rows=rows.slice(0,10);
  }
  if(!rows.length){$('dens').innerHTML='<p style="color:var(--muted);margin:0">'+
    (lastDens.length?'Активных уровней нет — все ушли/сняты/съедены.':'Пока нет данных — копятся поллером во время торгов.')+'</p>';return}
  let h='<table><thead><tr><th>Тикер</th><th>Сторона</th><th>Цена</th><th>Размер</th><th>Съедено</th><th>Факт</th><th>R/avg</th><th>Статус</th></tr></thead><tbody>';
  for(const r of rows){
    const cls=r.side==='bid'?'bid':'ask';
    const pct=r.eaten_pct||0;
    const pCls=pct>70?'p-high':pct>30?'p-mid':'p-low';
    const pctTxt=pct>0?`<span class="pct">${pct.toFixed(0)}%</span>`:'';
    const bar=pct>0?`<span class="bar ${pCls}"><i style="width:${Math.min(pct,100)}%"></i></span>`:'';
    // Факт = реальные сделки по цене уровня (лента), а не оценка из стакана.
    const tr=r.traded||0, trPct=r.traded_pct||0;
    const trTxt=tr>0?`${fmtInt(tr)} <span class="pct">${trPct.toFixed(0)}%</span>`:'—';
    h+=`<tr class="${r.is_super?'super':''}">
      <td class="ticker">${r.ticker}</td>
      <td class="${cls}">${r.side==='bid'?'🟢':'🔴'}</td>
      <td class="${cls}">${fmt(r.price)}</td>
      <td><b>${fmtInt(r.size)}</b></td>
      <td class="eaten-cell">${fmtEaten(r.eaten)}${pctTxt}${bar}</td>
      <td class="eaten-cell">${trTxt}</td>
      <td>${fmt(r.ratio)}</td>
      <td class="${r.active?'active':'gone'}">${r.is_super?'💥 ':''}${r.status||(r.active?'активна':'ушла')}</td></tr>`;
  }
  $('dens').innerHTML=h+'</tbody></table>';
}
function pctCell(v){
  if(v===null||v===undefined) return '<td>—</td>';
  const cls=v>0.005?'up':v<-0.005?'down':'';
  return `<td class="${cls}"><b>${v>0?'+':''}${v.toFixed(2)}%</b></td>`;
}
function renderChg(rows){
  if(!rows.length){$('chg').innerHTML='<p style="color:var(--muted);margin:0">Нет данных.</p>';return}
  let h='<table><thead><tr><th>Тикер</th><th>Последняя</th><th>Δ 10 мин</th><th>Δ с начала дня</th><th>Оборот</th></tr></thead><tbody>';
  for(const r of rows){
    h+=`<tr><td class="ticker">${r.ticker}</td>
      <td>${fmt(r.last)}</td>
      ${pctCell(r.change10_pct)}
      ${pctCell(r.change_day_pct)}
      <td>${fmtBig(r.turnover)}</td></tr>`;
  }
  $('chg').innerHTML=h+'</tbody></table>';
}
// ==================== Итоги дня ====================
const dayModal=$('day-modal');
function dStatus(m){const el=$('day-status');if(!m){el.className='status';el.textContent='';return}
  el.className='status error';el.textContent=m}
function fmtVol(n){if(n===null||n===undefined)return '—';
  return n>=1e9?(n/1e9).toFixed(1)+' млрд':n>=1e6?(n/1e6).toFixed(1)+' млн':fmtInt(n)}
function chip(lbl,val){return `<div class="chip"><span class="lbl">${lbl}</span><b>${val}</b></div>`}
function fmtDateRu(d){return d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4)}

async function loadDates(){
  try{
    const d=await jget('/api/moex/day/dates');
    const h=d.dates.map(x=>
      `<button class="h-date${x===dayDate?' sel':''}" data-d="${x}">${fmtDateRu(x)}${x===d.today?' (сегодня)':''}</button>`).join('');
    $('hist').innerHTML=h;
  }catch(e){$('hist').innerHTML='<span class="meta">История недоступна: '+e.message+'</span>'}
}

async function loadDaySummary(date){
  dayDate=date;
  $('day-date').textContent=fmtDateRu(date)+' · сутки торгов с 03:00 МСК';
  $('day-meta').textContent='загрузка…';
  $('day-body').innerHTML='';
  dStatus(null);
  try{
    const d=await jget('/api/moex/day/summary?date='+encodeURIComponent(date));
    renderSummary(d);
    $('day-meta').textContent='построено '+d.generated_at.slice(11,19)+' МСК'+
      (d.db_ok?'':' · БД плотностей недоступна');
    loadDates();  // подсветить выбранную дату
  }catch(e){dStatus('Ошибка: '+e.message);$('day-meta').textContent=''}
}

function renderSummary(d){
  const c=d.counts;
  let h='<div class="chips">'+
    chip('Уровней за день',`${c.levels}${c.super_levels?' · 💥 супер: '+c.super_levels:''}`)+
    chip('Событий плотностей',`${c.events}${c.events_super?' · супер: '+c.events_super:''}`)+
    chip('Ударов по уровням',fmtInt(c.hits_total))+
    chip('Съедено (оценка)',fmtBig(c.eaten_total))+
    chip('Проторговано (факт)',fmtBig(c.traded_total))+
    '</div>';
  if(Object.keys(c.statuses).length)
    h+='<p class="meta" style="margin:0 0 4px">Статусы уровней: '+
      Object.entries(c.statuses).map(([k,v])=>`${k} — ${v}`).join(' · ')+'</p>';
  h+='<div class="sec-title">Цены (топ движений · T-Invest)</div>';
  if(d.prices.length){
    h+='<table><thead><tr><th>Тикер</th><th>Открытие</th><th>Закрытие/последняя</th>'+
      '<th title="к закрытию предыдущих торговых суток">Δ к пред.</th>'+
      '<th title="от открытия этих суток">Δ от откр.</th><th>Объём, шт</th></tr></thead><tbody>';
    for(const p of d.prices)
      h+=`<tr><td class="ticker">${p.ticker}</td><td>${fmt(p.open)}</td><td><b>${fmt(p.close)}</b></td>`+
        `${pctCell(p.change_pct)}${pctCell(p.change_day_pct)}<td>${fmtVol(p.volume)}</td></tr>`;
    h+='</tbody></table>';
  }else h+='<p style="color:var(--muted)">Цены недоступны (T-Invest не вернул дневные свечи).</p>';
  h+='<div class="sec-title">Плотности, появившиеся в этот день (топ по размеру)</div>';
  if(d.levels.length){
    h+='<table><thead><tr><th>Тикер</th><th>Сторона</th><th>Цена</th><th>Размер</th>'+
      '<th>Съедено</th><th>Факт</th><th>R/avg</th><th>Появилась</th><th>Статус</th></tr></thead><tbody>';
    for(const r of d.levels){
      const cls=r.side==='bid'?'bid':'ask';
      const pct=r.eaten_pct||0;
      const pCls=pct>70?'p-high':pct>30?'p-mid':'p-low';
      const pctTxt=pct>0?`<span class="pct">${pct.toFixed(0)}%</span>`:'';
      const bar=pct>0?`<span class="bar ${pCls}"><i style="width:${Math.min(pct,100)}%"></i></span>`:'';
      const tr=r.traded||0, trPct=r.traded_pct||0;
      const trTxt=tr>0?`${fmtInt(tr)} <span class="pct">${trPct.toFixed(0)}%</span>`:'—';
      h+=`<tr class="${r.is_super?'super':''}"><td class="ticker">${r.ticker}</td>`+
        `<td class="${cls}">${r.side==='bid'?'🟢 bid':'🔴 ask'}</td>`+
        `<td class="${cls}">${fmt(r.price)}</td><td><b>${fmtInt(r.size)}</b></td>`+
        `<td class="eaten-cell">${fmtEaten(r.eaten)}${pctTxt}${bar}</td>`+
        `<td class="eaten-cell">${trTxt}</td><td>${fmt(r.ratio)}</td>`+
        `<td>${fmtTs(r.first_ts)}</td>`+
        `<td class="${r.gone?'gone':'active'}">${r.is_super?'💥 ':''}${r.status}</td></tr>`;
    }
    h+='</tbody></table>';
  }else h+='<p style="color:var(--muted);margin:0">Уровней за этот день в БД нет'+
    ' (после ночной чистки остаются только самые крутые уровни прошлых дней).</p>';
  h+='<p class="meta" style="margin:14px 0 0">'+d.note+'</p>';
  $('day-body').innerHTML=h;
}

let dayDate=null;
async function openDay(){
  dayModal.classList.add('open');
  if(!dayDate){
    try{const d=await jget('/api/moex/day/dates');dayDate=d.today;}
    catch(e){dayDate=new Date().toISOString().slice(0,10)}
  }
  loadDates();
  loadDaySummary(dayDate);
}
$('day-btn').addEventListener('click',openDay);
$('day-close').addEventListener('click',()=>dayModal.classList.remove('open'));
dayModal.addEventListener('click',e=>{if(e.target===dayModal)dayModal.classList.remove('open')});
$('day-hist-btn').addEventListener('click',()=>{
  const el=$('hist');el.classList.toggle('open');
  if(el.classList.contains('open'))loadDates();
});
$('hist').addEventListener('click',e=>{
  const b=e.target.closest('.h-date');if(!b)return;
  loadDaySummary(b.dataset.d);
});
$('day-refresh').addEventListener('click',()=>loadDaySummary(dayDate));

async function load(){
  try{
    const [top, chg] = await Promise.allSettled([
      // «Только живые»: серверный фильтр active=1 — без него топ по
      // размеру вытесняют стены прошлых дней, активных в лимите мало
      jget('/api/tinkoff/densities/top?limit='+
        ($('dens-live').checked?'10&active=1':'25')),
      jget('/api/moex/changes?limit=10'),
    ]);
    if(top.status==='fulfilled') renderDens(top.value.by_size);
    if(chg.status==='fulfilled') renderChg(chg.value.items);
    const errs=[top,chg].filter(x=>x.status==='rejected').map(x=>x.reason.message);
    setStatus(errs.length?('Частично: '+errs.join(' | ')):null);
  }catch(e){setStatus('Ошибка: '+e.message)}
}
$('status') && load();
$('dens-live').addEventListener('change',load);
setInterval(()=>{if(document.visibilityState==='visible')load()},15000);
load();
</script>
</body>
</html>

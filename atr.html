<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MOEX · ATR отчёт</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0f1115;--panel:#161a22;--border:#242a36;--text:#d7dbe3;--muted:#7b8494;
        --accent:#4f9eff;--green:#3fbf7f;--yellow:#e6c14a;--orange:#e6903a;--red:#e05b5b;--blue:#4f9eff;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--text);font-size:14px}
  header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sub{color:var(--muted);font-size:12px}
  .controls{padding:16px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
            border-bottom:1px solid var(--border);background:var(--panel)}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .field input,.field select{background:#0f1115;border:1px solid var(--border);color:var(--text);
       padding:7px 10px;border-radius:6px;font-size:13px;min-width:90px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:6px;
         font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s}
  button:hover{opacity:.85}
  button:disabled{opacity:.5;cursor:wait}
  main{padding:20px 24px 40px}
  .status{padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:13px;display:none}
  .status.error{display:block;background:#2a1416;color:var(--red);border:1px solid #4a1f22}
  .status.info{display:block;background:#14202a;color:var(--accent);border:1px solid #1f3a4a}
  .summary{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:130px}
  .card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .card .v{font-size:18px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
  thead th{text-align:right;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--muted);
           font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--bg)}
  thead th:first-child,thead th:last-child{text-align:left}
  tbody td{padding:7px 10px;border-bottom:1px solid #1a1f29;text-align:right}
  tbody td:first-child,tbody td:last-child{text-align:left}
  tbody tr:hover{background:#141821}
  .verdict{font-weight:500}
  .v-затишье{color:var(--blue)}
  .v-спокойно{color:var(--green)}
  .v-норма{color:var(--yellow)}
  .v-повыш-волат{color:var(--orange)}
  .v-выброс{color:var(--red)}
  .v-супервсплеск{color:#ff4d4d;font-weight:700}
  .v-na{color:var(--muted)}
  .arr-up{color:var(--green);font-weight:600}
  .arr-down{color:var(--red);font-weight:600}
  tr.spike-up{background:rgba(63,191,127,.10)}
  tr.spike-up:hover{background:rgba(63,191,127,.18)}
  tr.spike-down{background:rgba(224,91,91,.10)}
  tr.spike-down:hover{background:rgba(224,91,91,.18)}
  tr.super-up{background:rgba(63,191,127,.24);font-weight:600}
  tr.super-up:hover{background:rgba(63,191,127,.34)}
  tr.super-down{background:rgba(224,91,91,.24);font-weight:600}
  tr.super-down:hover{background:rgba(224,91,91,.34)}
  .bar{display:inline-block;height:8px;background:var(--accent);border-radius:2px;vertical-align:middle;margin-left:8px;min-width:1px}
  .dist{margin-top:20px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 18px}
  .dist h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .dist-row{display:flex;align-items:center;gap:12px;padding:4px 0;font-size:13px}
  .dist-row .name{width:130px}
  .dist-row .count{width:50px;text-align:right;color:var(--muted)}
  .dist-row .pct{width:60px;text-align:right;color:var(--muted)}
  .subh{margin:16px 0 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .filters{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:10px 0 4px;font-size:13px;color:var(--muted)}
  .filters select{background:#0f1115;border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;outline:none}
  .filters select:focus{border-color:var(--accent)}
  .hourchart{display:flex;align-items:flex-end;gap:3px;height:90px;padding:6px 2px 0}
  .hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
  .hcol .hv{font-size:10px;color:var(--muted)}
  .hbar{width:100%;max-width:30px;background:var(--accent);border-radius:2px 2px 0 0;position:relative;min-height:2px}
  .hbar .hsup{position:absolute;bottom:0;left:0;right:0;background:var(--red);border-radius:2px 2px 0 0}
  .hcol .hn{font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>MOEX · ATR отчёт</h1>
  <span class="sub">10-минутные свечи · сравнение Range / ATR</span>
</header>
<div class="controls">
  <div class="field"><label>Тикер</label><input id="ticker" value="SBER" maxlength="12"></div>
  <div class="field"><label>Board</label>
    <select id="board">
      <option value="TQBR" selected>TQBR (акции T+2)</option>
      <option value="TQTF">TQTF (ETF)</option>
      <option value="RFUD">RFUD (фьючерсы)</option>
    </select>
  </div>
  <div class="field"><label>Период ATR</label><input id="atr_period" type="number" value="14" min="2" max="100"></div>
  <div class="field"><label>Дней истории</label><input id="days_back" type="number" value="10" min="1" max="90"></div>
  <div class="field"><label>Дата (пусто = последний)</label><input id="report_date" type="date"></div>
  <button id="load">Загрузить</button>
</div>
<main>
  <div id="status" class="status"></div>
  <div id="summary" class="summary"></div>
  <div id="table-wrap"></div>
  <p id="data-note" style="display:none;color:var(--muted);font-size:12px;margin:10px 0 0"></p>
  <div id="dist-wrap"></div>
  <div id="spikes-wrap"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const statusEl=$('status'),summaryEl=$('summary'),tableWrap=$('table-wrap'),distWrap=$('dist-wrap');
function setStatus(m,k){if(!m){statusEl.className='status';statusEl.textContent='';return}
  statusEl.className='status '+(k||'info');statusEl.textContent=m}
function fmt(n,d=4){return n===null||n===undefined?'—':Number(n).toFixed(d)}
function fmtInt(n){return n===null||n===undefined?'—':Number(n).toLocaleString('ru-RU')}
function fmtWindow(period, interval){
  const m = period*interval;
  return m>=60 ? `${Math.floor(m/60)} ч ${m%60} мин` : `${m} мин`;
}
function verdictClass(v){return 'v-'+v.replace(/\s+/g,'-').replace(/\.$/,'')}
async function load(){
  const btn=$('load');btn.disabled=true;setStatus('Загрузка с MOEX ISS…','info');
  const p=new URLSearchParams({
    ticker:$('ticker').value.trim().toUpperCase()||'SBER',
    board:$('board').value,
    atr_period:$('atr_period').value||14,
    days_back:$('days_back').value||10,
  });
  const rd=$('report_date').value;if(rd)p.set('report_date',rd);
  try{
    const r=await fetch('/api/atr/report?'+p);
    if(!r.ok){const t=await r.text();let m=t;try{m=JSON.parse(t).detail||t}catch(e){}
      setStatus('Ошибка: '+m,'error');summaryEl.innerHTML='';tableWrap.innerHTML='';distWrap.innerHTML='';
      $('spikes-wrap').innerHTML='';spikeData=null;$('data-note').style.display='none';return}
    render(await r.json());setStatus(null);
  }catch(e){setStatus('Сеть/сервер: '+e.message,'error')}
  finally{btn.disabled=false}
}
function render(data){
  const s=data.summary;
  summaryEl.innerHTML=`
    <div class="card"><div class="k">Тикер</div><div class="v">${data.ticker}</div></div>
    <div class="card"><div class="k">Дата</div><div class="v">${data.report_date}</div></div>
    <div class="card"><div class="k">ATR период</div><div class="v">${data.atr_period} свечей</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">≈ ${fmtWindow(data.atr_period, data.interval)}</div></div>
    <div class="card"><div class="k">Свечей</div><div class="v">${s.total_candles}</div></div>
    <div class="card"><div class="k">Средний R/ATR</div><div class="v">${fmt(s.avg_ratio,2)}</div></div>
    <div class="card"><div class="k">Медиана</div><div class="v">${fmt(s.median_ratio,2)}</div></div>
    <div class="card"><div class="k">Мин / Макс</div><div class="v">${fmt(s.min_ratio,2)} / ${fmt(s.max_ratio,2)}</div></div>
    <div class="card"><div class="k">Всплески</div>
      <div class="v"><span class="arr-up">▲ ${s.up_spikes??0}</span> / <span class="arr-down">▼ ${s.down_spikes??0}</span></div></div>
    <div class="card"><div class="k">Супервсплески</div>
      <div class="v">💥 <span class="arr-up">▲ ${s.super_up_spikes??0}</span> / <span class="arr-down">▼ ${s.super_down_spikes??0}</span></div></div>
    <div class="card"><div class="k">Объём дня</div><div class="v">${fmtInt(s.total_volume)}</div></div>`;
  if(!data.rows.length){tableWrap.innerHTML='<p style="color:var(--muted)">Нет свечей за выбранный день (выходной?).</p>';distWrap.innerHTML='';$('spikes-wrap').innerHTML='';spikeData=null;$('data-note').style.display='none';return}
  let h=`<table><thead><tr><th>Время</th><th>Open</th><th>High</th><th>Low</th><th>Close</th>
    <th>Объём</th><th>Range</th><th>ATR</th><th>R/ATR</th><th>Вердикт</th></tr></thead><tbody>`;
  for(const row of data.rows){
    const spike = row.ratio!==null && row.ratio>2;
    const isSuper = row.ratio!==null && row.ratio>4;
    const cls = isSuper ? (row.dir==='up'?'super-up':'super-down')
              : spike ? (row.dir==='up'?'spike-up':'spike-down') : '';
    const arrow = spike ? (row.dir==='up'?'<span class="arr-up">▲</span>'
                              : row.dir==='down'?'<span class="arr-down">▼</span>':'') : '';
    h+=`<tr class="${cls}"><td>${row.time}</td><td>${fmt(row.open)}</td><td>${fmt(row.high)}</td><td>${fmt(row.low)}</td>
    <td>${fmt(row.close)}</td><td>${fmtInt(row.volume)}</td><td>${fmt(row.range)}</td><td>${fmt(row.atr)}</td><td>${fmt(row.ratio,2)}</td>
    <td class="verdict ${verdictClass(row.verdict)}">${row.mark} ${row.verdict} ${arrow}</td></tr>`}
  h+='</tbody></table>';tableWrap.innerHTML=h;
  const lastCandle=data.rows[data.rows.length-1];
  const noteEl=$('data-note');
  noteEl.style.display='block';
  noteEl.innerHTML=`Все времена — <b>МСК (UTC+3)</b>. Последняя свеча: <b>${lastCandle.time} МСК</b> ·
    отчёт построен: <b>${data.generated_at?.slice(11,19) ?? '—'} МСК</b>`;
  const total=Object.entries(s.distribution).filter(([k])=>k!=='n/a').reduce((a,[,v])=>a+v,0);
  const order=['затишье','спокойно','норма','повыш. волат.','выброс','супервсплеск'];
  let d='<div class="dist"><h3>Распределение по волатильности</h3>';
  for(const k of order){const v=s.distribution[k]||0;const pct=total?(v/total*100):0;const w=Math.round(pct*2.5);
    const detail = k==='выброс' ? `<span class="arr-up" style="font-size:11px">▲ ${s.up_spikes??0}</span>
      <span class="arr-down" style="font-size:11px">▼ ${s.down_spikes??0}</span>`
      : k==='супервсплеск' ? `<span class="arr-up" style="font-size:11px">▲ ${s.super_up_spikes??0}</span>
      <span class="arr-down" style="font-size:11px">▼ ${s.super_down_spikes??0}</span>` : '';
    d+=`<div class="dist-row"><span class="name">${k}</span>${detail}<span class="count">${v}</span>
    <span class="pct">${pct.toFixed(1)}%</span><span class="bar" style="width:${w}px"></span></div>`}
  if(s.distribution['n/a']){d+=`<div class="dist-row" style="color:var(--muted)">
    <span class="name">нет ATR (прогрев)</span><span class="count">${s.distribution['n/a']}</span><span class="pct"></span></div>`}
  d+='</div>';distWrap.innerHTML=d;
  renderSpikePanel(data);
}

// ===== Панель аналитики всплесков (окно истории) =====
let spikeData=null, spikeFilter={kind:'all', dir:'all'};

function renderSpikePanel(data){
  const sw=$('spikes-wrap');
  if(!data.spikes.length){
    spikeData=null;
    sw.innerHTML='<div class="dist"><h3>Всплески за окно истории</h3>'+
      '<p style="color:var(--muted);margin:0">Всплесков (R/ATR > 2) не найдено.</p></div>';
    return;
  }
  spikeData=data;
  // Сводка по дням
  let days='<h3 class="subh">Сводка по дням</h3><table><thead><tr><th>Дата</th><th>Всплесков</th>'+
    '<th>💥 супер</th><th>▲ вверх</th><th>▼ вниз</th><th>Макс R/ATR</th></tr></thead><tbody>';
  for(const d of data.by_day){
    days+=`<tr><td>${d.date}</td><td>${d.count}</td><td>${d.super_count?'💥 '+d.super_count:0}</td>`+
      `<td class="arr-up">${d.up||'—'}</td><td class="arr-down">${d.down||'—'}</td><td><b>${d.max_ratio}</b></td></tr>`;
  }
  days+='</tbody></table>';
  // Распределение по часам (МСК)
  const hours=Object.keys(data.by_hour);
  const maxC=Math.max(...hours.map(h=>data.by_hour[h]));
  let chart='<h3 class="subh">Всплески по часам (МСК) · красным — супервсплески</h3><div class="hourchart">';
  for(const h of hours){
    const v=data.by_hour[h], sv=data.by_hour_super[h]||0;
    const vh=Math.round(v/maxC*62);
    chart+=`<div class="hcol" title="${h}:00 — всего ${v}${sv?', супервсплесков '+sv:''}">
      <span class="hv">${v}</span>
      <div class="hbar" style="height:${vh}px"><div class="hsup" style="height:${Math.round(sv/maxC*62)}px"></div></div>
      <span class="hn">${h}</span></div>`;
  }
  chart+='</div>';
  sw.innerHTML=`<div class="dist"><h3>Всплески за окно истории · ${data.spikes.length} (топ по силе)</h3>
    <div class="filters">Тип: <select id="f-kind">
        <option value="all">все</option><option value="выброс">только выбросы</option>
        <option value="супервсплеск">только супервсплески</option></select>
      Направление: <select id="f-dir">
        <option value="all">все</option><option value="up">▲ вверх</option>
        <option value="down">▼ вниз</option></select></div>
    ${days}${chart}<h3 class="subh" id="spike-list-h"></h3><div id="spike-list"></div></div>`;
  $('f-kind').value=spikeFilter.kind; $('f-dir').value=spikeFilter.dir;
  renderSpikeList();
}

function renderSpikeList(){
  if(!spikeData) return;
  const rows=spikeData.spikes.filter(sp=>
    (spikeFilter.kind==='all'||sp.kind===spikeFilter.kind)&&
    (spikeFilter.dir==='all'||sp.dir===spikeFilter.dir));
  $('spike-list-h').textContent=`Список всплесков · ${rows.length}`;
  if(!rows.length){$('spike-list').innerHTML='<p style="color:var(--muted);margin:0">Под фильтр ничего не попало.</p>';return}
  let h='<table><thead><tr><th>Дата</th><th>Время</th><th>Тип</th><th>R/ATR</th>'+
    '<th>Напр.</th><th>Close</th><th>Объём</th></tr></thead><tbody>';
  for(const sp of rows){
    const sup=sp.kind==='супервсплеск';
    const dir=sp.dir==='up'?'<span class="arr-up">▲ вверх</span>'
            :sp.dir==='down'?'<span class="arr-down">▼ вниз</span>':'—';
    h+=`<tr class="${sup?(sp.dir==='up'?'super-up':'super-down'):(sp.dir==='up'?'spike-up':'spike-down')}">`+
      `<td>${sp.date}</td><td>${sp.time}</td>`+
      `<td>${sup?'💥 <span class="v-супервсплеск">супервсплеск</span>':'🔴 выброс'}</td>`+
      `<td><b>${sp.ratio}</b></td><td>${dir}</td><td>${fmt(sp.close)}</td><td>${fmtInt(sp.volume)}</td></tr>`;
  }
  h+='</tbody></table>';
  $('spike-list').innerHTML=h;
}
$('load').addEventListener('click',load);
$('report_date').addEventListener('change',load);
$('ticker').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
$('f-kind').addEventListener('change',e=>{spikeFilter.kind=e.target.value;renderSpikeList()});
$('f-dir').addEventListener('change',e=>{spikeFilter.dir=e.target.value;renderSpikeList()});
load();
</script>
</body>
</html>
